[package]
name = "click_automation"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default"] }
egui = "0.29"
arboard = "3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = "0.4"
enigo = "0.6"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
image = "0.25"
rayon = "1.10"
thiserror = "1.0"
scraper = "0.20"
rust_xlsxwriter = "0.79"

[dependencies.rapidocr-core]
path = "vendor/rapidocr-core"
default-features = false


[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(windows)'.dependencies]
rdev = "0.5"
windows = { version = "0.58", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
percent-encoding = "2.3"
zbus = "4.4"
